server:
  port: 8100

spring:
  application:
    name: bank-gateway

  config:
    import: "optional:consul:"

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/bank-realm

  cloud:
    consul:
      host: localhost          # Адрес Consul (по умолчанию localhost)
      port: 8500               # Порт Consul (8500 по умолчанию)
      config:
        watch:
          wait-time: 5
        enabled: true            # Включаем Consul Config для внешней конфигурации
        defaultContext: application  # Контекст по умолчанию
        prefixes:
          - config

    gateway:
      server:
        webflux:
          routes:
            - id: account-service
              uri: lb://account-service:8200
              predicates:
                - Path=/account/**
              filters:
                - name: JwtTokenRelay
            - id: cash-service
              uri: lb://cash-service:8210
              predicates:
                - Path=/cash/**
              filters:
                - name: JwtTokenRelay
            - id: transfer-service
              uri: lb://transfer-service:8230
              predicates:
                - Path=/transfer/**
              filters:
                - name: JwtTokenRelay

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    root: INFO
    ru.practicum.bank.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG