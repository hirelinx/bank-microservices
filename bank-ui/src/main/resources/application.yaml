server:
  port: 8080

spring:
  application:
    name: bank-ui

  # Общие настройки (Keycloak, адрес Gateway) — в Consul KV: config/application/data
  config:
    import: "optional:consul:"

  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      config:
        enabled: true
        format: YAML
        default-context: application
        prefixes:
          - config

  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: bank-ui
            client-secret: PAydhyWTVsJTzcfkfjTfFzpLcRMkwxdZ
            authorization-grant-type: authorization_code
            scope: openid, profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
