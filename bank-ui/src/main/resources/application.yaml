server:
  port: 8080

spring:
  application:
    name: bank-ui

  config:
    import: "optional:consul:"

  cloud:
    consul:
      host: localhost          # Адрес Consul (по умолчанию localhost)
      port: 8500               # Порт Consul (8500 по умолчанию)
      config:
        enabled: true            # Включаем Consul Config для внешней конфигурации
        defaultContext: application  # Контекст по умолчанию
        prefixes:
          - config

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: bank-ui
            client-secret: PAydhyWTVsJTzcfkfjTfFzpLcRMkwxdZ
            authorization-grant-type: authorization_code
            scope: openid, profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            provider: keycloak
        provider:
          keycloak:
            issuer-uri: http://localhost:8180/realms/bank-realm

bank:
  gateway:
    base-url: http://bank-gateway:8100

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    root: INFO