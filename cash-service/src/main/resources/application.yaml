server:
  port: 8210

spring:
  application:
    name: cash-service

  config:
    import: "optional:consul:"

  cloud:
    consul:
      host: localhost          # Адрес Consul (по умолчанию localhost)
      port: 8500               # Порт Consul (8500 по умолчанию)
      config:
        enabled: true            # Включаем Consul Config для внешней конфигурации
        defaultContext: application  # Контекст по умолчанию
        prefixes:
          - config

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/bank-realm
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: cash-service
            client-secret: fSVOW8SqFTUHLemVMAM7Vad7IBgrQ8si
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            issuer-uri: http://localhost:8180/realms/bank-realm

management:
  endpoints:
    web:
      exposure:
        include: "*"

bank:
  notification:
    base-url: http://notification-service:8220
  account:
    base-url: http://account-service:8200