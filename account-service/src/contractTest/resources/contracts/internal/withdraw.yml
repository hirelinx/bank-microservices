description: Cash снимает деньги со счёта пользователя с сервисным токеном
name: withdraw
request:
  method: POST
  url: /account/internal/ivanov/withdraw
  headers:
    Content-Type: application/json
    Authorization: Bearer service-token
  body:
    amount: 100
  matchers:
    headers:
      - key: Authorization
        regex: "Bearer .+"
response:
  status: 200
  headers:
    Content-Type: application/json
  body:
    login: ivanov
    balance: 900.00
