server:
  port: 8200

spring:
  application:
    name: account-service

  config:
    import: "optional:consul:"

  cloud:
    consul:
      host: localhost          # Адрес Consul (по умолчанию localhost)
      port: 8500               # Порт Consul (8500 по умолчанию)
      config:
        enabled: true            # Включаем Consul Config для внешней конфигурации
        defaultContext: application  # Контекст по умолчанию
        prefixes:
          - config

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=account
    username: postgres
    password: password

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: account

  flyway:
    schemas: account
    default-schema: account

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/bank-realm
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: account-service
            client-secret: Am77Jy9baHFrIIY29gY0Ff5r8nofw723
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            issuer-uri: http://localhost:8180/realms/bank-realm

bank:
  notification:
    base-url: http://notification-service:8220

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    root: INFO