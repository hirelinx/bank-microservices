bank:
  keycloak:
    public-url: http://localhost:65535
    internal-url: http://localhost:65535
  datasource:
    host: localhost
    port: 5432
    database: postgres

spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${bank.keycloak.public-url}/realms/bank-realm
          jwk-set-uri: ${bank.keycloak.internal-url}/realms/bank-realm/protocol/openid-connect/certs
