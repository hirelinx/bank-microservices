server:
  port: 8220


spring:
  application:
    name: notification-service

  config:
    import: "optional:consul:"

  cloud:
    consul:
      host: localhost          # Адрес Consul (по умолчанию localhost)
      port: 8500               # Порт Consul (8500 по умолчанию)
      config:
        enabled: true            # Включаем Consul Config для внешней конфигурации
        defaultContext: application  # Контекст по умолчанию
        prefixes:
          - config

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=notification
    username: postgres
    password: password

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: notification

  flyway:
    schemas: notification
    default-schema: notification

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/bank-realm

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    root: INFO
