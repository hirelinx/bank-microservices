description: Перевод суммы больше баланса отправителя возвращает ошибку для показа пользователю
name: transfer_insufficient_funds
request:
  method: POST
  url: /transfer
  headers:
    Content-Type: application/json
    Authorization: Bearer user-token
  body:
    toLogin: petrov
    amount: 100000
  matchers:
    headers:
      - key: Authorization
        regex: "Bearer .+"
response:
  status: 409
  headers:
    Content-Type: application/problem+json
  body:
    errors:
      - Недостаточно средств на счету
