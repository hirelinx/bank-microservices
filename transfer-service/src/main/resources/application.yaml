server:
  port: 8230

spring:
  application:
    name: transfer-service

  # Общие настройки (БД, Keycloak, адреса сервисов) — в Consul KV: config/application/data
  config:
    import: "optional:consul:"

  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      config:
        enabled: true
        format: YAML
        default-context: application
        prefixes:
          - config

  datasource:
    url: jdbc:postgresql://${bank.datasource.host}:${bank.datasource.port}/${bank.datasource.database}?currentSchema=transfer

  jpa:
    properties:
      hibernate:
        default_schema: transfer

  flyway:
    schemas: transfer
    default-schema: transfer

  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: transfer-service
            client-secret: JcsVjVYLeY2ZgDMQb63xxQDnL92pxE8A
            authorization-grant-type: client_credentials
